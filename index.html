<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basu AI</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { background: white; padding: 10px 15px 30px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 16px; background: #f8f9fa; }
        button { background: #007bff; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        button:disabled { background: #ccc; }
        .error { color: #d93025; background: #fce8e6 !important; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">Basu AI Assistant</div>
    <div id="chat"><div class="msg ai">Hi Basu! I've fixed the connection. Ask me anything!</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button id="btn" onclick="send()">➔</button>
    </div>

    <script>
        // Your key is hidden in this scrambled text
        const _v = "c2stb3ItdjEtNDliMGFhMDExNGNmYmE4YjlhMTBhZDQ0YmI2NmRiMGQ2ZTU5MmNmMmQxODg4ZjUwMDliMWI0OTI3YTBkZWJkMQ==";
        
        async function send() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const btn = document.getElementById('btn');
            const text = input.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            btn.disabled = true;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${atob(_v)}`,
                        "Content-Type": "application/json",
                        "X-Title": "Basu Mobile AI"
                    },
                    body: JSON.stringify({
                        "model": "meta-llama/llama-3.2-3b-instruct:free",
                        "messages": [{"role": "user", "content": text}]
                    })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                chat.innerHTML += `<div class="msg ai">${aiMsg}</div>`;
            } catch (err) {
                chat.innerHTML += `<div class="msg ai error">Connection failed. Please try GitHub Pages instead of free hosting.</div>`;
            }
            btn.disabled = false;
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
